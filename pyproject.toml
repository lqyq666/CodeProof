[project]
name = "codeproof"
version = "0.1.0"
description = "Controlled-write, independently-verified Qoder coding agent workbench with a reconcilable usage ledger."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "qodercn-agent-sdk>=0.1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"